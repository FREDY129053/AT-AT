[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fredy129053", email = "fredy1290534518@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "contracts",
    "fastapi>=0.136.3",
    "faststream[rabbit]>=0.7.1",
    "scipy>=1.17.1",
    "statsmodels>=0.14.6",
]

[project.scripts]
ab-agent = "backend.main:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { path = "../../packages/contracts", editable = true }
shared = { path = "../../packages/shared", editable = true }
