[project]
name = "api-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fredy129053", email = "fredy1290534518@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "shared",
    "bpmn-parser>=1.0.16",
    "jinja2>=3.1.6",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-mistralai>=1.1.2",
    "pydantic>=2.12.5",
    "schemathesis>=4.14.3",
    "prance>=25.4.8.0",
    "openapi-spec-validator>=0.8.5",
    "jsonpath-ng>=1.8.0",
]

[project.scripts]
api-agent = "api_agent.main:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
contracts = { path = "../../packages/contracts", editable = true }
shared = { path = "../../packages/shared", editable = true }

[dependency-groups]
dev = [
    "pydantic-2-mermaid>=0.7.3",
    "pydantic-diagram>=0.1.5",
]
